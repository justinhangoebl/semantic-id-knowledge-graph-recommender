embedding_size: 64              # (int) The embedding size of users, items and entities.
kg_embedding_size: 64           # (int) The embedding size of relations in knowledge graph.
layers: [64]                    # (list of int) The hidden size in GNN layers.
mess_dropout: 0.1               # (float) The message dropout rate in GNN layer.
reg_weight: 1e-5                # (float) The L2 regularization weight.
aggregator_type: 'bi'           # (str) The aggregator type used in GNN. Range in ['gcn', 'graphsage', 'bi'].

eval_args:                      # (dict) 4 keys: group_by, order, split, and mode
  split: {'RS':[0.6,0.2,0.2]}   # (dict) The splitting strategy ranging in ['RS','LS'].
  group_by: user                # (str) The grouping strategy ranging in ['user', 'none'].
  order: TO                     # (str) The ordering strategy ranging in ['RO', 'TO'].
  mode: full                    # (str) The evaluation mode ranging in ['full','unixxx','popxxx','labeled'].

user_inter_num_interval: "[5,inf)"    # (str) User interval for filtering inter, such as [A,B] / [A,B) / (A,B) / (A,B].     [5,inf)
item_inter_num_interval: "[0,inf)"    # (str) Item interval for filtering inter, such as [A,B] / [A,B) / (A,B) / (A,B].     [5,inf)

epochs: 300