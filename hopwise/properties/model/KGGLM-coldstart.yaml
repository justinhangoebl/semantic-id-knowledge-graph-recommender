# Cold-start override for KGGLM.
# Use together with the main KGGLM.yaml:
#   python -m hopwise run --model KGGLM --dataset ml1m \
#     --config-files hopwise/properties/model/KGGLM.yaml \
#                    hopwise/properties/model/KGGLM-coldstart.yaml
#
# Removes K-core filtering so cold items (few interactions) are included in
# training and the bucketed cold-start evaluation can cover all frequency tiers.
item_inter_num_interval: "[0,inf)"
user_inter_num_interval: "[5,inf)"

wandb_project: 'KGGLM - coldstart'
