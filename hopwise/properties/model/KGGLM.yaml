# OVERAL.yaml
# Environment Settings
gpu_id: '9'                     # (str) The id of GPU device(s).
worker: 0                       # (int) The number of workers processing the data.
use_gpu: True                   # (bool) Whether or not to use GPU.
seed: 2024                      # (int) Random seed.
state: INFO                     # (str) Logging level.
reproducibility: True           # (bool) Whether or not to make results reproducible.
data_path: './dataset/'           # (str) The path of input dataset.
checkpoint_dir: 'saved'         # (str) The path to save checkpoint file.
show_progress: True             # (bool) Whether or not to show the progress bar of every epoch.
save_dataset: False             # (bool) Whether or not to save filtered dataset.
dataset_save_path: ~            # (str) The path of saved dataset.
save_dataloaders: True         # (bool) Whether or not save split dataloaders.
dataloaders_save_path: './dataloader/' # (str) The path of saved dataloaders.
log_wandb: True                # (bool) Whether or not to use Weights & Biases(W&B).
progress_bar_rich: True         # (bool) Whether or not to use rich progress bar.
shuffle: True                   # (bool) Whether or not to shuffle the training data before each epoch.
weight_precision: float32

# Training Settings
eval_step: 1                    # (int) The number of training epochs before an evaluation on the valid dataset.
stopping_step: 10               # (int) The threshold for validation-based early stopping.
loss_decimal_place: 4           # (int) The decimal place of training loss.
require_pow: False              # (bool) Whether or not to perform power operation in EmbLoss.
enable_amp: False               # (bool) Whether or not to use mixed precision training.
enable_scaler: False            # (bool) Whether or not to use GradScaler in mixed precision training.
transform: ~                    # (str) The transform operation for batch data process.

repeatable: False               # (bool) Whether to evaluate results with a repeatable recommendation scene.
metrics: ["Recall","MRR","NDCG","Hit","Precision"]  # (list or str) Evaluation metrics.
topk: [10]                      # (list or int or None) The value of k for topk evaluation metrics.
valid_metric: NDCG@10           # (str) The evaluation metric for early stopping.
valid_metric_bigger: True       # (bool) Whether to take a bigger valid metric value as a better result.

# Sample.yaml
numerical_features: []          # (list) Float feature fields to be embedded
additional_feat_suffix: ~       # (list) Control loading additional atomic files.
user_inter_num_interval: "[5,inf)"    # (str) User interval for filtering inter, such as [A,B] / [A,B) / (A,B) / (A,B].     [5,inf)
item_inter_num_interval: "[5,inf)"    # (str) Item interval for filtering inter, such as [A,B] / [A,B) / (A,B) / (A,B].     [5,inf)

# knowledge_path_base.yaml
train_neg_sample_args:
    sample_num: "none"
load_col:
    inter: ['user_id', 'item_id', 'rating', 'timestamp']
    kg: ['head_id', 'relation_id', 'tail_id']
    link: ['item_id', 'entity_id']

# Data preprocessing for knowledge graph triples
entity_kg_num_interval: "[0,inf)"       # (str) Entity interval for filtering kg.
relation_kg_num_interval: "[0,inf)"     # (str) Relation interval for filtering kg.

# ml-1m.yaml8
# Atomic File Format
field_separator: "\t"           # (str) Separator of different columns in atomic files.
seq_separator: " "              # (str) Separator inside the sequence features.

# Basic Information
USER_ID_FIELD: user_id          # (str) Field name of user ID feature.
ITEM_ID_FIELD: item_id          # (str) Field name of item ID feature.
RATING_FIELD: rating            # (str) Field name of rating feature.
TIME_FIELD: timestamp           # (str) Field name of timestamp feature.
seq_len: ~                      # (dict) Field name of sequence feature: maximum length of each sequence
LABEL_FIELD: label              # (str) Expected field name of the generated labels for point-wise dataLoaders.
threshold: ~                    # (dict) 0/1 labels will be generated according to the pairs.
NEG_PREFIX: neg_                # (str) Negative sampling prefix for pair-wise dataLoaders.

# Sequential Model Needed
ITEM_LIST_LENGTH_FIELD: item_length   # (str) Field name of the feature representing item sequences' length.
LIST_SUFFIX: _list              # (str) Suffix of field names which are generated as sequences.
MAX_ITEM_LIST_LENGTH: 50        # (int) Maximum length of each generated sequence.
POSITION_FIELD: position_id     # (str) Field name of the generated position sequence.

# Knowledge-based Model Needed
HEAD_ENTITY_ID_FIELD: head_id   # (str) Field name of the head entity ID feature.
TAIL_ENTITY_ID_FIELD: tail_id   # (str) Field name of the tail entity ID feature.
RELATION_ID_FIELD: relation_id  # (str) Field name of the relation ID feature.
ENTITY_ID_FIELD: entity_id      # (str) Field name of the entity ID.
ui_relation: "[UI-Relation]"    # (str) Name assigned to the interaction relation between users and items.
kg_reverse_r: False             # (bool) Whether to reverse relations of triples for bidirectional edges.

# Knowledge Path Sampling-based Model Needed
context_length: ~               # (int) Maximum length of the context. Set to (path_hop_length * 2) + 1 (U) + 2 (BOS/EOS) by default.
metapaths: ~                    # (list) Metapaths used to sample paths.
tokenizer:                      # (dict) Tokenizer parameters.
    model: WordLevel            # (str) Tokenizer model.
    special_tokens:             # (dict) Special tokens.
        mask_token: "[MASK]"    # (str) Mask token.
        unk_token: "[UNK]"      # (str) Unknown token.
        pad_token: "[PAD]"      # (str) Padding token.
        eos_token: "[EOS]"      # (str) End of sequence token.
        bos_token: "[BOS]"      # (str) Beginning of sequence token.
        sep_token: "[SEP]"      # (str) Separator token.
        cls_token: "[CLS]"      # (str) Classification token.

unload_col: ~                   # (dict) The suffix of atomic files: (list) field names NOT to be loaded.
unused_col: ~                   # (dict) The suffix of atomic files: (list) field names which are loaded but not used.

# Filtering
rm_dup_inter: ~                 # (str) Whether to remove duplicated user-item interactions.
val_interval: ~                 # (dict) Filter inter by values in {value field (str): interval (str)}.
filter_inter_by_user_or_item: True    # (bool) Whether or not to filter inter by user or item.

# Preprocessing
alias_of_user_id: ~             # (list) Fields' names remapped into the same index system with USER_ID_FIELD.
alias_of_item_id: ~             # (list) Fields' names remapped into the same index system with ITEM_ID_FIELD.
alias_of_entity_id: ~           # (list) Fields' names remapped into the same index system with ENTITY_ID_FIELD.
alias_of_relation_id: ~         # (list) Fields' names remapped into the same index system with RELATION_ID_FIELD.
preload_weight: ~               # (dict) Preloaded weight in {IDs (token): pretrained vectors (float-like)}.
normalize_field: ~              # (list) List of filed names to be normalized.
normalize_all: True            # (bool) Whether or not to normalize all the float like fields.

embedding_size: 768             # (int) Size of the embeddings.
num_heads: 12                   # (int) Number of heads in the multi-head attention.
num_layers: 6                   # (int) Number of layers in the transformer.
path_hop_length: 3              # (int) Number of hops in the knowledge path.
MAX_PATHS_PER_USER: 250        # (int) Maximum number of kg sampled paths per user.
pretrain_epochs: 3              # (int) Number of epochs for pre-training.
epochs: 2                       # (int) The number of training epochs.
train_batch_size: 256           # (int) The training batch size.
eval_batch_size: 128           # (int) The evaluation batch size.
save_step: 50                   # (int) Number of steps to save the model during pre-training.
metric_decimal_place: 4         # (int) The decimal place of metric scores.
base_model: distilgpt2
sequence_postprocessor: BeamSearch

# Evaluation Settings only for FineTune
eval_args:                      # (dict) 4 keys: group_by, order, split, and mode
  split: {'RS':[0.6,0.2,0.2]}   # (dict) The splitting strategy ranging in ['RS','LS'].
  group_by: user                # (str) The grouping strategy ranging in ['user', 'none'].
  order: TO                     # (str) The ordering strategy ranging in ['RO', 'TO'].
  mode: full                    # (str) The evaluation mode ranging in ['full','unixxx','popxxx','labeled'].

# KGGLM.yaml
gpu_id: '1'                                         # (str) The id of GPU device(s).

wandb_project: 'CIKM - KGGLM - ml1m'     # (str) The project name in W&B.        ml-1m
#wandb_project: 'CIKM - KGGLM - lfm'     # (str) The project name in W&B.        lfm

train_stage: 'pretrain'                            # (str) The training stage. Range in ['pretrain', 'finetune'].
pre_model_path: ''                                 # (str) The path of pretrained model.

#train_stage: 'finetune'                            # (str) The training stage. Range in ['pretrain', 'finetune'].
#pre_model_path: 'saved/huggingface-distilgpt2-KGGLM-ml1m-pretrained-3.pth/checkpoint-80586'  # (str) The path of pretrained model.

learning_rate: 2e-5             # (float) Learning rate for optimizer.                      ml-1m
weight_decay: 0.01              # (float) Weight decay for optimizer.                       ml-1m
warmup_steps: 2500               # (int) Number of warmup steps for learning rate scheduler. ml-1m

#learning_rate: 2e-4             # (float) Learning rate for optimizer.                      lfm
#weight_decay: 0.01              # (float) Weight decay for optimizer.                       lfm
#warmup_steps: 2000               # (int) Number of warmup steps for learning rate scheduler. lfm

use_kg_token_types: True        # (bool) Whether to use token types for the knowledge graph.
clip_grad_norm: ~               # (dict) The args of clip_grad_norm_ which will clip gradient norm of model.
learner: adamW                  # (str) The name of used optimizer.

main: 'LR2e-4, TO 0.6, TC True, CP True, RBP True, grad_norm None'

path_generation_args:
    paths_per_user: 20          # (int) Number of paths generated per user.
    num_beams: 30               # (int) Number of beams for beam search.
    num_beam_groups: 5          # (int) Number of groups for diverse beam search.
    diversity_penalty: 0.3      # (float) Diversity penalty for beam search.
    length_penalty: 0.0         # (float) Length penalty for beam search.
    top_k: ~                    # (int) The number of highest probability vocabulary tokens to keep for top-k-filtering.
    top_p: ~                    # (float) The cumulative probability for top-p-filtering.
    do_sample: False            # (bool) Whether to use sampling ; use greedy decoding otherwise.

path_sample_args:
    # both pretrain and finetune
    MAX_RW_TRIES_PER_IID: 100      # (int) Maximum number of tries per entity. Paper likely uses 1 (no retry for speed).
    path_token_separator: " "   # (str) Token separator for paths.

    # finetune only
    temporal_causality: False   # (bool) Whether to use temporal causality.
    collaborative_path: False   # (bool) Whether to include users in sampled paths. True causes dead-ends: users in CKG only connect to items, so any intermediate-hop user has no entity neighbors and the path dies.
    restrict_by_phase: True    # (bool) Whether to restrict the last item in the reasoning path by the used ids in the dataloader phase (for fine-tuning, set True).
    strategy: constrained-rw    # (str) Strategy for sampling paths.
    MAX_CONSECUTIVE_INVALID: 10 # (int) Maximum number of consecutive invalid paths per user.
    MAX_RW_PATHS_PER_HOP: 10    # (int) Maximum number of paths sampled at each hop for constrained random walk.
    parallel_max_workers: 1    # (int) Maximum number of workers for parallel processing.

    # pretrain only
    pretrain_hop_length: (5, 5)  # (tuple) The range of the hop length for pre-training. Paper uses 5 hops.
    pretrain_paths: 500          # (int) Number of paths per entity for pre-training. Paper uses 500.


#Training dynamics — standard to sweep:
#
#learning_rate: 2e-4 — most sensitive; try 1e-4, 3e-4. Training from scratch is more sensitive here than fine-tuning a pretrained model.
#warmup_steps: 250 — 250 steps is likely too few if your dataset is large (500 paths × all entities). Should scale with ~5–10% of total pretrain steps. Worth testing 500–2000.
#pretrain_epochs: 3 — how much pretraining transfers to finetune is the central question; test 3, 5, 10. More epochs don't always help if the paths are too repetitive.
#train_batch_size: 256 — interacts with learning_rate via effective gradient noise; less interesting to sweep alone.


#Pretrain dataset — high impact, SPRIG-specific:
#
#pretrain_hop_length: (5, 5) — fixed length is conservative. A variable range like (3, 5) exposes the model to shorter paths (more common in sparse KGs) and may improve robustness. The sequence length is auto-set from pretrain_hop_length[1], so (3,5) vs (5,5) is a clean ablation.
#pretrain_paths: 500 — directly controls dataset size per entity. Halving to 250 saves compute; doubling to 1000 may help coverage for low-degree entities. Diminishing returns past a point.
#MAX_RW_TRIES_PER_IID: 100 — at 100 tries you're already near saturation for most entities; not worth sweeping.