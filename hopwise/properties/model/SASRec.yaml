n_layers: 2                     # (int) The number of transformer layers in transformer encoder.
n_heads: 2                      # (int) The number of attention heads for multi-head attention layer.
hidden_size: 64                 # (int) The number of features in the hidden state.
inner_size: 256                 # (int) The inner hidden size in feed-forward layer.
hidden_dropout_prob: 0.5        # (float) The probability of an element to be zeroed.
attn_dropout_prob: 0.5          # (float) The probability of an attention score to be zeroed.
hidden_act: 'gelu'              # (str) The activation function in feed-forward layer.
layer_norm_eps: 1e-12           # (float) A value added to the denominator for numerical stability.
initializer_range: 0.02         # (float) The standard deviation for normal initialization.
loss_type: 'CE'                  # (str) CE converges faster and matches full-ranking eval better than BPR.
epochs: 300                   # (int) Early stopping handles actual cutoff; 300 is just a safe ceiling.
stopping_step: 10             # (int) Stop after 10 non-improving epochs.
learning_rate: 0.001          # (float) Standard SASRec LR; global default 2e-4 is too low.
train_batch_size: 2048        # (int) 8x global default; cuts epoch time from ~33 min to ~4-5 min.


eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}   # last item = test, 2nd-last = valid
  mode: full                         # rank all items, no sampled negatives
  
train_neg_sample_args: ~

user_inter_num_interval: "[5,inf)"    # (str) User interval for filtering inter, such as [A,B] / [A,B) / (A,B) / (A,B].     [5,inf)
item_inter_num_interval: "[5,inf)"    # (str) Item interval for filtering inter, such as [A,B] / [A,B) / (A,B) / (A,B].     [5,inf)

load_col:
    inter: ['user_id', 'item_id', 'timestamp']

gpu_id: '5'                         # (int) The GPU id to use. Range in [-1, 0, 1, 2, 3]. -1 means using CPU.

#cold_start_holdout_ratio: 0.2

output_scores: False           # (bool) Whether to store per-step logit scores during generation (expensive, needed for significance testing).